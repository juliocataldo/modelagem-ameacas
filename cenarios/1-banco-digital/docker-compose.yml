# Documentação da arquitetura. Não é necessário subir os containers.
services:
  gateway:
    image: nginx:1.27
    ports: ["443:443"]
    networks: [borda, servicos]

  auth-service:
    image: coopera/auth:2.3
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SMS_API_KEY: ${SMS_API_KEY}
    networks: [servicos]

  pix-service:
    image: coopera/pix:2.3
    environment:
      DATABASE_URL: postgres://pix:${DB_PASSWORD}@postgres-core:5432/core
      REDIS_URL: redis://redis:6379
    networks: [servicos, dados]

  painel-antifraude:
    image: coopera/painel:1.8
    ports: ["8081:8081"]
    networks: [borda, servicos]

  postgres-core:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks: [dados]

  redis:
    image: redis:7
    command: redis-server
    networks: [servicos, dados]

networks:
  borda:
  servicos:
    internal: true
  dados:
    internal: true
